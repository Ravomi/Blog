{{- $rel := .RelPermalink -}}
<header class="site-header" id="J_header">
  <div class="site-header-inner">
    <a href="{{ "" | relURL }}" class="brand">
      <span class="brand-icon" aria-hidden="true">🍞</span>
      <span class="brand-name">{{ .Site.Title }}</span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ "" | relURL }}" class="nav-pill {{ if .IsHome }}is-active{{ end }}">首页</a>
      <a href="{{ "notes/" | relURL }}" class="nav-pill {{ if eq .Section "notes" }}is-active{{ end }}">碎碎念</a>
      <a href="{{ "weekly/" | relURL }}" class="nav-pill {{ if eq .Section "weekly" }}is-active{{ end }}">周刊</a>
      <a href="{{ "posts/" | relURL }}" class="nav-pill {{ if eq .Section "posts" }}is-active{{ end }}">文章</a>
      <a href="{{ "about/" | relURL }}" class="nav-pill {{ if strings.HasSuffix $rel "/about/" }}is-active{{ end }}">关于</a>
    </nav>

    <div class="site-actions">
      <button id="search-btn" class="icon-btn search-trigger" type="button" aria-label="搜索" title="搜索 (按 /)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="10.5" cy="10.5" r="7.2" stroke="currentColor" stroke-width="2" />
          <path d="M20.5 20.5L15.8 15.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <kbd>/</kbd>
      </button>

      {{ with .Site.Params.github }}
      <a href="{{ . }}" target="_blank" rel="noopener" class="icon-btn" aria-label="GitHub" title="GitHub">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.43 2.86 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-1.03-.01-1.86-2.51.46-3.16-.61-3.36-1.17-.11-.29-.6-1.17-1.03-1.41-.35-.19-.85-.65-.01-.66.79-.01 1.35.72 1.54 1.02.9 1.51 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.23-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.26 2.75 1.03.8-.22 1.65-.34 2.5-.34s1.7.11 2.5.34c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.91.68 1.85 0 1.34-.01 2.41-.01 2.75 0 .26.19.58.69.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
      </a>
      {{ end }}

      {{ with .Site.Params.x }}
      <a href="{{ . }}" target="_blank" rel="noopener" class="icon-btn" aria-label="X" title="X (@Les_pauvres)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.17h1.7L7.4 4.73H5.58l11.09 14.44z"/></svg>
      </a>
      {{ end }}
    </div>
  </div>
</header>
