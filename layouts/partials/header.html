{{- $rel := .RelPermalink -}}
<div class="header-menu" id="J_header">
  <ul class="header-item-container">
    <li class="header-item-title {{ if .IsHome }}active{{ end }}">
      <a href="{{ "" | relURL }}" class="title">🍞 {{ .Site.Title }}</a>
    </li>

    <li class="header-item-left {{ if eq .Section "posts" }}active{{ end }}">
      <a href="{{ "posts/" | relURL }}">Blog</a>
    </li>

    <li class="header-item-left {{ if eq .Section "notes" }}active{{ end }}">
      <a href="{{ "notes/" | relURL }}">Notes</a>
    </li>

    <li class="header-item-left {{ if eq .Section "weekly" }}active{{ end }}">
      <a href="{{ "weekly/" | relURL }}">Weekly</a>
    </li>

    <li class="header-item-left header-item-about {{ if strings.HasSuffix $rel "/about/" }}active{{ end }}">
      <a href="{{ "about/" | relURL }}">About</a>
    </li>

    <li class="header-item header-social">
      {{ with .Site.Params.github }}
      <a href="{{ . }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.43 2.86 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-1.03-.01-1.86-2.51.46-3.16-.61-3.36-1.17-.11-.29-.6-1.17-1.03-1.41-.35-.19-.85-.65-.01-.66.79-.01 1.35.72 1.54 1.02.9 1.51 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.23-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.26 2.75 1.03.8-.22 1.65-.34 2.5-.34s1.7.11 2.5.34c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.91.68 1.85 0 1.34-.01 2.41-.01 2.75 0 .26.19.58.69.48A10.01 10.01 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
      </a>
      {{ end }}
      {{ with .Site.Params.x }}
      <a href="{{ . }}" target="_blank" rel="noopener" aria-label="X" title="X">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.17h1.7L7.4 4.73H5.58l11.09 14.44z"/></svg>
      </a>
      {{ end }}
    </li>

    <li class="header-item search-btn-container">
      <button id="search-btn" class="search-btn" type="button" aria-label="Search" title="Search (Press /)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="10.5" cy="10.5" r="7.5" stroke="currentColor" stroke-width="1.8" />
          <path d="M21 21L15.8 15.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </li>
  </ul>
</div>
